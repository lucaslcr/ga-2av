<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Geometria Analítica · 2ª AV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de estudo. Sidebar escura fixa no desktop, barra inferior no celular; conteúdo em coluna de até 860px.
   Cor de destaque = coral do pincel vermelho da professora; azul = vetores; verde = conferido. */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F4F4F5; --ink:#09090B; --muted:#71717A; --line:#E4E4E7;
  --side:#FAFAFA; --side-2:#F0F0F2; --side-ink:#09090B; --side-muted:#71717A; --side-line:#E4E4E7;
  --accent:#2457D6; --accent-2:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#EEF3FD; --accent-text:#1D47B5;
  --blue:#2457D6; --blue-soft:#EEF3FD;
  --ok:#15803D; --ok-soft:#F0FAF3; --bad:#C2261D; --bad-soft:#FDF2F1; --tip:#8A5A00; --tip-soft:#FEF8EB;
  --sheet:#FAFAFA; --rep:#FDEBC8;
  --v1:#2457D6; --v2:#D97706; --v3:#15803D; --v4:#BE3A8C; --axis:#A1A1AA; --grid:#ECECEF;
  --shadow:0 1px 2px rgba(9,9,11,.05),0 4px 12px -6px rgba(9,9,11,.08); --shadow-sm:0 1px 2px rgba(9,9,11,.04);
  --display:"Geist",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --font:"Geist",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --side-w:256px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#09090B; --surface:#111113; --surface-2:#18181B; --ink:#FAFAFA; --muted:#A1A1AA; --line:#27272A;
    --side:#0C0C0E; --side-2:#1C1C20; --side-ink:#FAFAFA; --side-muted:#A1A1AA; --side-line:#1F1F23;
    --accent:#5B8DEF; --accent-2:#5B8DEF; --accent-ink:#0A1530; --accent-soft:#141D33; --accent-text:#93B4F5;
    --blue:#5B8DEF; --blue-soft:#141D33;
    --ok:#4ADE80; --ok-soft:#0E1F15; --bad:#F87171; --bad-soft:#2A1213; --tip:#FBBF24; --tip-soft:#241C0B;
    --sheet:#0C0C0E; --rep:#3A2C12;
    --v1:#5B8DEF; --v2:#F59E0B; --v3:#4ADE80; --v4:#F472B6; --axis:#52525B; --grid:#1F1F23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px -8px rgba(0,0,0,.6); --shadow-sm:0 1px 2px rgba(0,0,0,.3);}
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#09090B; --surface:#111113; --surface-2:#18181B; --ink:#FAFAFA; --muted:#A1A1AA; --line:#27272A;
    --side:#0C0C0E; --side-2:#1C1C20; --side-ink:#FAFAFA; --side-muted:#A1A1AA; --side-line:#1F1F23;
    --accent:#5B8DEF; --accent-2:#5B8DEF; --accent-ink:#0A1530; --accent-soft:#141D33; --accent-text:#93B4F5;
    --blue:#5B8DEF; --blue-soft:#141D33;
    --ok:#4ADE80; --ok-soft:#0E1F15; --bad:#F87171; --bad-soft:#2A1213; --tip:#FBBF24; --tip-soft:#241C0B;
    --sheet:#0C0C0E; --rep:#3A2C12;
    --v1:#5B8DEF; --v2:#F59E0B; --v3:#4ADE80; --v4:#F472B6; --axis:#52525B; --grid:#1F1F23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px -8px rgba(0,0,0,.6); --shadow-sm:0 1px 2px rgba(0,0,0,.3);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance}
h1{font-size:30px;line-height:1.12;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;line-height:1.2;margin:0 0 8px;font-weight:700}
h3{font-size:16.5px;margin:18px 0 8px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:14.5px}

/* ---------- casca ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);border-right:1px solid var(--side-line);color:var(--side-ink);display:none;flex-direction:column;gap:22px;
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 14px -6px var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;flex:none}
.brand b{display:block;font-family:var(--display);font-size:16px;line-height:1.15}
.brand>div span{display:block;font-size:12.5px;color:var(--side-muted)}
.navl{display:grid;gap:3px;margin:0;padding:0;list-style:none}
.nb{width:100%;display:flex;align-items:center;gap:12px;font:inherit;font-weight:600;font-size:15px;color:var(--side-muted);background:transparent;border:0;border-radius:12px;padding:11px 14px;position:relative;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nb svg{width:20px;height:20px;flex:none}
.nb:hover{color:var(--side-ink);background:var(--side-2)}
.nb.on{color:var(--accent-text);background:var(--side-2);font-weight:700}
.nb.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.nb .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--side-muted);font-variant-numeric:tabular-nums}
.subnav{display:grid;gap:2px;margin:2px 0 6px 32px}
.subnav button{font:inherit;font-size:14px;color:var(--side-muted);background:transparent;border:0;text-align:left;padding:5px 10px;border-radius:8px;cursor:pointer}
.subnav button.on{color:var(--accent-text);background:var(--side-2);font-weight:700}
.sprog{background:var(--side-2);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.sprog b{display:block;font-size:14px}
.sprog span{font-size:12.5px;color:var(--side-muted)}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding-block:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.topbar .brand b{color:var(--ink)} .topbar .brand>div span{color:var(--muted)}
.topbar .mark{width:34px;height:34px;font-size:14px;border-radius:9px}
.topbar .ring{margin-left:0}.topbar .acctbtn{margin-left:auto}
.page{max-width:880px;margin:0 auto;padding-top:18px}
.page.wide{max-width:1180px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bb{font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;cursor:pointer}
.bb svg{width:22px;height:22px}
.bb.on{color:var(--accent-text);background:var(--accent-soft)}
.bb.on svg{transform:translateY(-1px)}
@media (min-width:960px){
  .side{display:flex}
  .main{margin-left:var(--side-w);padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px));padding-block:0 64px}
  .topbar,.bnav{display:none}
  .page{padding-top:36px}
}

.themebtn{display:flex;align-items:center;gap:10px;font:inherit;font-weight:600;font-size:14px;color:var(--side-muted);background:transparent;border:1px solid var(--side-line);border-radius:12px;padding:9px 12px;cursor:pointer;margin-top:auto;transition:color .15s,border-color .15s}
.themebtn svg{width:18px;height:18px;flex:none}
.themebtn:hover{color:var(--accent-text);border-color:var(--accent)}
.topbar .themebtn{margin-top:0;width:38px;height:38px;padding:0;justify-content:center;border-color:var(--line);color:var(--ink);background:var(--surface)}
.topbar .themebtn span{display:none}
.dash{display:grid;gap:0 20px}
@media (min-width:1180px){.dash{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.area{width:100%;display:flex;align-items:center;gap:14px;font:inherit;color:inherit;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.area:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.area .at{flex:1;min-width:0;display:flex;flex-direction:column}
.area .at b{font-size:15px}.area .at span{font-size:13px;color:var(--muted)}
.area .chev{font-size:22px;color:var(--muted);line-height:1}
.area.cur{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 12px 24px -14px var(--accent)}
.area.cur .at span,.area.cur .chev{color:rgba(255,255,255,.85)}
.area.cur .ring circle:first-of-type{stroke:rgba(255,255,255,.35)}.area.cur .ring circle:last-of-type{stroke:#fff}

/* ---------- componentes (estilo shadcn) ---------- */
button:focus-visible,.in:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px}.btn svg{width:17px;height:17px;transition:transform .2s}
.btn:hover svg{transform:translateX(2px)}
.seg.has-ind{position:relative}
.seg .ind{position:absolute;left:0;top:5px;bottom:5px;border-radius:10px;background:var(--accent);box-shadow:0 6px 14px -8px var(--accent);transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s cubic-bezier(.2,.8,.2,1);z-index:0}
.seg.has-ind button{position:relative;z-index:1}
.seg.has-ind button.on{background:transparent;box-shadow:none}
.toasts{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;left:max(16px,env(safe-area-inset-left,0px))}
@media (min-width:960px){.toasts{bottom:calc(24px + env(safe-area-inset-bottom,0px));left:auto}}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14.5px;font-weight:600;box-shadow:var(--shadow);max-width:360px;pointer-events:none}
.toast svg{width:19px;height:19px;flex:none}
.toast.ok svg{color:var(--ok)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;background:var(--ink);color:var(--surface);font:600 12px/1.2 var(--font);padding:6px 9px;border-radius:8px;white-space:nowrap;z-index:40;pointer-events:none;box-shadow:var(--shadow-sm);animation:fadeUp .15s ease-out}
.v3.loading .viz{background:linear-gradient(100deg,var(--sheet) 30%,var(--surface-2) 50%,var(--sheet) 70%);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-80% 0}}
.v3tb button svg{width:16px;height:16px}
.area .chev svg{width:20px;height:20px;display:block}
.fb{display:flex;gap:10px;align-items:flex-start}.fb>svg{width:19px;height:19px;flex:none;margin-top:2px}
.hints li{display:flex;gap:10px;align-items:flex-start}.hints li>svg{width:18px;height:18px;flex:none;margin-top:2px}
.hints li b{display:block;margin-bottom:2px}

/* ---------- cabeçalho de página ---------- */
.phead{margin:0 0 20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text);margin:0 0 6px}
.lede{color:var(--muted);margin:0;max-width:62ch}

/* ---------- superfícies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card>.eyebrow{color:var(--muted)}
.hero{background:var(--hero);color:#fff;border:0;border-radius:22px;padding:26px 24px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.hero::before{content:"";position:absolute;left:38%;bottom:-90px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.18);pointer-events:none}
.hero .ring circle:first-of-type{stroke:rgba(255,255,255,.28);opacity:1}.hero .ring circle:last-of-type{stroke:#fff}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero h2{font-size:26px;margin:0 0 6px;color:#fff}
.hero p{color:rgba(255,255,255,.86);margin:0 0 14px;max-width:46ch}
.hero .ring text{fill:#fff}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero .ring{display:none}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid transparent;border-radius:var(--r);padding:16px;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.stat:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.stats .stat:nth-child(1){background:var(--t2);--c:var(--accent)}.stats .stat:nth-child(2){background:var(--t3);--c:var(--blue)}
.stats .stat:nth-child(3){background:var(--t1);--c:var(--v2)}.stats .stat:nth-child(4){background:var(--t4);--c:var(--ok)}
.stat .si{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:#fff;margin-bottom:6px}
.stat .si svg{width:19px;height:19px}
.stat .k{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.stat .n{font-family:var(--display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .n small{font-size:15px;color:var(--muted);font-weight:700}
.bar{height:6px;background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stat.okk .bar i{background:var(--ok)}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- roteiro ---------- */
.road{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:0;position:relative}
.rs{position:relative;padding-left:0}
.rs:not(:last-child)::before{content:"";position:absolute;left:23px;top:38px;bottom:-6px;width:2px;background:var(--line)}
.rs.done:not(:last-child)::before{background:var(--ok)}
.rb{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:12px;padding:9px 10px;cursor:pointer;transition:background .15s}
.rb:hover{background:var(--surface-2)}
.rs.next .rb{background:var(--accent-soft);border-color:var(--accent)}
.rn{flex:none;width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.rs.done .rn{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.rs.next .rn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt b{font-size:15.5px}
.rt .chip{align-self:flex-start}
.rd{font-size:14px;color:var(--muted);line-height:1.4}

/* ---------- chips, grades ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.chip.st{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.st.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.rs.next .chip{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.qc{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:7px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.qc:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.qc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qc b{font-size:15px}
.qc .desc{font-size:14.5px;color:var(--muted);line-height:1.4}
.qc.full{border-color:var(--ok);background:var(--ok-soft)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}

/* ---------- controles ---------- */
.seg{display:flex;gap:4px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pbtn,.seg button{font:inherit;font-weight:700;font-size:14px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.seg button{border:0;background:transparent;color:var(--muted);flex:none}
.pbtn:hover{border-color:var(--accent)}
.pbtn.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px -8px var(--accent)}
.pbtn small,.seg small{font-weight:400;opacity:.75}
.btn{font:inherit;font-weight:700;font-size:15px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px -10px var(--accent)}
.btn.pri:hover{filter:brightness(1.05)}
.hero .btn.pri{background:#fff;border-color:#fff;color:#4A3BC4;box-shadow:0 8px 20px -8px rgba(20,10,80,.55)}
.btn.sm{font-size:13.5px;padding:6px 11px}
.in{width:88px;height:42px;text-align:center;font-family:var(--mono);font-size:15px;font-weight:700;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);transition:border-color .15s,background .15s}
.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.in.w{width:136px}
.in.good{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.in.badx{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .3s}
.in:disabled{opacity:1}
.keys{display:flex;gap:4px;flex-wrap:wrap}
.key{font-family:var(--mono);font-weight:700;font-size:15px;min-width:38px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.key:hover{border-color:var(--ink)}

/* ---------- conteúdo ---------- */
ul.k{margin:0 0 10px;padding-left:20px}
ul.k li{margin-bottom:6px}
.f{font-family:var(--mono);font-size:14px;font-weight:500;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tx{white-space:nowrap}
.txd{display:block;overflow-x:auto;overflow-y:hidden;padding:10px 12px;margin:8px 0 12px;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
.katex{font-size:1.08em}
.box{font-family:var(--mono);font-size:14px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0 12px;line-height:1.7;overflow-x:auto}
.code{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:14.5px}
.code pre{margin:6px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:var(--blue)}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:15px}
.tipn{background:var(--tip-soft);color:var(--tip);border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:15px}
.enun{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 12px;font-size:16px}

/* ---------- etapas ---------- */
.step{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:var(--surface);animation:fadeUp .25s ease-out}
.step.done{background:var(--ok-soft);border-color:transparent}
.sh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sn{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.step.done .sn{color:var(--ok);background:transparent;border-color:var(--ok);animation:pop .35s ease-out}
.sh b{font-size:15.5px}
.sd{font-size:15px;margin:8px 0 4px}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px}
.fields label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;flex-wrap:wrap}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-weight:700;font-size:15px}
.pv{font-size:14px;color:var(--muted);margin-top:8px;min-height:0}
.pv:empty{display:none}
.pv .katex{color:var(--ink)}
.choice{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.choice .pbtn{text-align:left;white-space:normal}
.choice .pbtn.good{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice .pbtn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.fb{border-radius:10px;padding:9px 12px;font-size:15px;margin:10px 0 0;animation:fadeUp .2s ease-out}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.hints{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.hints li{background:var(--tip-soft);color:var(--tip);border-radius:10px;padding:8px 12px;font-size:15px;animation:fadeUp .25s ease-out}
.hints li b{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.oknote{font-size:15px;margin:8px 0 0;color:var(--ok)}
.viz{width:100%;height:300px;display:block;border-radius:12px;background:var(--sheet);border:1px solid var(--line);touch-action:none;cursor:grab;margin-top:12px}
.viz:active{cursor:grabbing}
.vizcap{font-size:13.5px;color:var(--muted);margin:6px 0 0;display:flex;gap:12px;flex-wrap:wrap}
.vizcap i{font-style:normal;font-weight:700}
.v3{position:relative;margin-top:12px}.v3 .viz{margin-top:0;height:340px;background:radial-gradient(120% 90% at 50% 0%,var(--surface) 0%,var(--sheet) 70%)}
.v3lab{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:12px}
.v3lab span{position:absolute;left:0;top:0;font:700 13px/1.2 var(--font);white-space:nowrap;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--surface) 78%,transparent);will-change:transform}
.v3lab span.ax{background:none;font-family:var(--mono);font-size:12px}
.v3tb{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.v3tb button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);font:700 14px/1 var(--font);cursor:pointer;display:grid;place-items:center;padding:0;backdrop-filter:blur(6px)}
.v3tb button:hover{border-color:var(--accent);color:var(--accent-text)}
.v3tb button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.v3hint{color:var(--muted);font-size:12.5px;margin-left:auto}
.sar{display:inline-grid;grid-template-columns:repeat(5,auto);gap:3px 5px;padding:4px 8px;border-left:2px solid var(--ink);font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.sar span{min-width:38px;height:32px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:6px;white-space:nowrap}
.sar span.rep{background:var(--rep)}
.sar span.bar{border-left:2px solid var(--ink)}
.scroll{overflow-x:auto}
details.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
details.q[open]{box-shadow:var(--shadow)}
details.q>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary b{font-family:var(--display);font-size:17px}
details.q .qb{padding:0 16px 16px}
details.q[open]>summary{border-bottom:1px solid var(--line);margin-bottom:14px}
.rules li{margin-bottom:6px}

/* ---------- teoria ---------- */
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.fill{height:100%;background:var(--ok);transition:width .5s}
.flash{border:1px solid var(--line);border-radius:16px;padding:18px;margin:6px 0 0;background:var(--surface-2);box-shadow:var(--shadow);animation:fadeUp .25s ease-out}
.flash .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fq{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.3;margin:12px 0 4px;text-wrap:balance}
.fa{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;animation:fadeUp .25s ease-out}
.ref{font-size:13px;color:var(--muted);margin-top:8px}
dl.defs{margin:0}
dl.defs dt{font-weight:700;margin-top:14px}
dl.defs dd{margin:4px 0 0;padding-left:12px;border-left:2px solid var(--accent-soft)}

@keyframes fadeUp{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.nb:focus-visible,.bb:focus-visible,.pbtn:focus-visible,.seg button:focus-visible,.btn:focus-visible,.in:focus-visible,.key:focus-visible,.qc:focus-visible,.stat:focus-visible,.rb:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:440px){h1{font-size:27px}body{font-size:16px}.in{width:78px}.vrow .in{width:60px}.vrow .in.w{width:84px}.vrow{gap:3px}.viz{height:250px}.v3 .viz{height:290px}.card{padding:16px 14px}}
</style>

/* ---------------- motor de etapas ---------------- */
function stepEngine(host,cfg){
  var key=cfg.id;
  function isDone(i){return cfg.persist?!!S.done[key+'.'+i]:!!mem[key+'.'+i];}
  function setDone(i){if(cfg.persist){S.done[key+'.'+i]=1;save();}else mem[key+'.'+i]=1;}
  function getV(k){return cfg.persist?(S.v[k]||''):(memV[k]||'');}
  function setV(k,v){if(cfg.persist){S.v[k]=v;save();}else memV[k]=v;}
  function draw(){
    host.innerHTML='';
    for(var i=0;i<cfg.steps.length;i++){host.appendChild(node(i));if(!isDone(i))break;}
    renderTexIn(host);
    if(cfg.steps.every(function(_,i){return isDone(i);})&&cfg.final){var f=el('div','fb ok',svgI('ok')+'<div>'+cfg.final+'</div>');host.appendChild(f);if(cfg.finalViz)viewer(host,cfg.finalViz.items,cfg.finalViz.cap);}
  }
  function node(i){
    var st=cfg.steps[i],done=isDone(i),sk=key+'.'+i,last=null;
    var box=el('div','step'+(done?' done':''));
    box.appendChild(el('div','sh','<span class="sn">'+(done?'✓ ':'')+'Etapa '+(i+1)+'</span><b>'+st.t+'</b>'));
    if(st.d)box.appendChild(el('p','sd',st.d));
    if(st.html)box.appendChild(el('div','',st.html));
    var inputs=[],pv=el('div','pv');pv.setAttribute('aria-live','polite');
    if(st.f){
      var groups=st.rows||[st.f.map(function(_,j){return j;})];
      groups.forEach(function(gr,gi){
        var fl=el('div','fields');
        if(st.rowLabels&&st.rowLabels[gi]!=null){
          var row=el('div','vrow','<span>'+st.rowLabels[gi]+' = (</span>');
          gr.forEach(function(j,n){var inp=mk(st.f[j]);row.appendChild(inp);if(n<gr.length-1)row.appendChild(el('span','',','));});
          row.appendChild(el('span','',')'));fl.appendChild(row);
        }else{
          gr.forEach(function(j){var f=st.f[j],lab=el('label','',f.l+' ');lab.appendChild(mk(f));fl.appendChild(lab);});
        }
        box.appendChild(fl);
      });
    }
    function mk(f){
      var inp=el('input','in'+(f.w?' w':''));inp.id='in-'+sk.replace(/\./g,'-')+'-'+f.k;inp.autocomplete='off';inp.setAttribute('autocapitalize','off');inp.spellcheck=false;
      inp.setAttribute('aria-label',(f.l||f.k).replace(/<[^>]+>/g,''));
      inp.value=getV(sk+'.'+f.k);
      if(done){inp.disabled=true;inp.classList.add('good');}
      inp.addEventListener('focus',function(){last=inp;showPv(inp);});inp.addEventListener('input',function(){showPv(inp);});
      inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&btn)btn.click();});
      inputs.push({f:f,inp:inp});return inp;
    }
    function showPv(inp){var v=inp.value;if(!/[\/√^a-zλμ]|sqrt/i.test(v)||!window.katex){pv.innerHTML='';return;}pv.innerHTML='Você digitou: '+tex(toTex(v));}
    if(st.f&&!done)box.appendChild(pv);
    var sel=getV(sk+'.choice');
    if(st.c){
      box.appendChild(el('p','sd','<b>'+st.c.q+'</b>'));
      var ch=el('div','choice');
      st.c.o.forEach(function(o,j){var b=el('button','pbtn'+(String(j)===String(sel)?(done?' good':' on'):''),o);b.type='button';if(done)b.disabled=true;
        b.onclick=function(){sel=String(j);setV(sk+'.choice',sel);ch.querySelectorAll('.pbtn').forEach(function(x,n){x.classList.toggle('on',n===j);});};ch.appendChild(b);});
      box.appendChild(ch);
    }
    var btn=null;
    if(done){
      if(st.ok)box.appendChild(el('p','oknote',st.ok));
      if(st.viz)viewer(box,st.viz.items,st.viz.cap);
      return box;
    }
    var acts=el('div','acts');
    btn=el('button','btn pri','Conferir');btn.type='button';acts.appendChild(btn);
    if(st.f){
      var keys=el('div','keys');
      ['−','/','√','x'].concat(st.keys||[]).forEach(function(kc){if(kc==='x'&&!st.vars)return;var kb=el('button','key',kc);kb.type='button';kb.setAttribute('aria-label','inserir '+kc);
        kb.onclick=function(){var t=last||inputs[0].inp;var a=t.selectionStart==null?t.value.length:t.selectionStart;t.value=t.value.slice(0,a)+kc+t.value.slice(t.selectionEnd==null?a:t.selectionEnd);t.focus();try{t.setSelectionRange(a+kc.length,a+kc.length);}catch(_){}};keys.appendChild(kb);});
      acts.appendChild(keys);
    }
    box.appendChild(acts);
    var fb=el('div',''),hl=el('ol','hints');box.appendChild(fb);box.appendChild(hl);
    function showHints(){var n=Math.min(att[sk]||0,(st.h||[]).length);hl.innerHTML='';for(var j=0;j<n;j++)hl.appendChild(el('li','',svgI('bulb')+'<div><b>Dica '+(j+1)+'/'+st.h.length+'</b>'+st.h[j]+'</div>'));}
    showHints();
    btn.onclick=function(){
      var res={};var allOk=true;
      inputs.forEach(function(o){var r=check(o.inp.value,o.f.a,o.f.tol);setV(sk+'.'+o.f.k,o.inp.value);res[r]=1;o.inp.classList.remove('good','badx');
        if(r==='ok')o.inp.classList.add('good');else{allOk=false;if(r!=='empty')o.inp.classList.add('badx');}});
      var choiceBad=st.c&&String(sel)!==String(st.c.a);
      if(allOk&&!choiceBad){setDone(i);if(cfg.onStep)cfg.onStep(i);var allD=cfg.steps.every(function(_,j){return isDone(j);});if(allD&&cfg.onDone)cfg.onDone();draw();
        if(allD){toast('Questão concluída.','ok','ok');celebrate();}else toast('Etapa '+(i+1)+' certa. Siga para a próxima.','ok','ok');
        var nx=host.querySelectorAll('.step');var tgt=nx[nx.length-1];if(tgt&&tgt.scrollIntoView&&i<cfg.steps.length-1){var inp=tgt.querySelector('.in');if(inp)inp.focus({preventScroll:true});}
        return;}
      att[sk]=(att[sk]||0)+1;
      var msg;
      if(res.empty)msg='Preencha todos os campos.';
      else if(res.parse)msg='Não consegui ler um dos campos. Use inteiros, frações como 5/7, raiz como √3 (ou sqrt(3))'+(st.vars?' e a letra '+st.vars:'')+'.';
      else if(res.sign)msg='Um campo tem o valor certo com o <b>sinal trocado</b>. Refaça pelos dois montes: some os positivos, some os negativos, subtraia.';
      else if(res.dec)msg='O valor bate, mas na prova fica em fração ou raiz (ex.: 5/7, √3). Reescreva assim.';
      else if(res.bad)msg='Os campos em vermelho não conferem.';
      else if(choiceBad)msg=sel===''||sel==null?'Escolha uma das opções.':'A escolha ainda não está certa.';
      else msg='Confira de novo.';
      if(choiceBad&&res.ok&&!res.bad&&!res.sign)msg='Os números estão certos. '+msg;
      fb.innerHTML='<div class="fb bad">'+svgI('alert')+'<div>'+msg+'</div></div>';showHints();
      if(window.Motion&&!RM){try{Motion.animate(box,{x:[0,-6,6,-3,3,0]},{duration:0.35});}catch(_){}}
    };
    return box;
  }
  draw();
}

  en:'Sabe-se que o vetor X é ortogonal a (1, 1, 0) e a (−1, 0, 1), tem norma √3 e, sendo θ o ângulo entre X e (0, 1, 0), tem-se cos θ > 0. Ache X.',

  steps:[

    h:['Produto escalar: a·1 + b·1 + c·0.','A equação é “(sua expressão) = 0”. Isole o b passando o resto para o outro lado com o sinal trocado.','Digite b em função de a. Exemplo de formato: 2a.']},
   {t:'2ª ortogonalidade',d:'X ⟂ (−1, 0, 1) ⇔ X·(−1, 0, 1) = 0.',vars:'a, b, c',keys:['a','b','c'],f:[{k:'e',l:'X·(−1, 0, 1) =',a:'-a+c',w:1},{k:'c',l:'então c =',a:'a',w:1}],
    h:['a·(−1) + b·0 + c·1.','Isole o c.']},
   {t:'Norma ao quadrado',d:'‖X‖ = √3 ⇒ eleve os dois lados ao quadrado: a² + b² + c² = 3. Troque b e c pelo que você achou.',vars:'a',keys:['a','²'],f:[{k:'n',l:'a² + b² + c² vira',a:'3a^2',w:1},{k:'a2',l:'a² =',a:'1'},{k:'a',l:'a = ±',a:'1'}],
    h:['Como no quadro: (√6)² = 6. Aqui, (√3)² = 3.','(−a)² = a², porque menos vezes menos dá mais. Some os três termos.','Divida os dois lados pelo coeficiente de a².']},
   {t:'Qual sinal?',d:'cos θ = X·(0, 1, 0) / (‖X‖·‖(0, 1, 0)‖). As normas são positivas, então o sinal do cos é o sinal de X·(0, 1, 0).',vars:'a, b, c',keys:['a','b','c'],f:[{k:'d',l:'X·(0, 1, 0) =',a:'b',w:1}],

   {t:'O vetor X',f:[{k:'x',a:'-1'},{k:'y',a:'1'},{k:'z',a:'-1'}],rows:[[0,1,2]],rowLabels:['X'],h:['Use o a escolhido e as relações b = −a e c = a.'],
    ok:'Conferência pelo produto vetorial: (1, 1, 0) × (−1, 0, 1) dá um vetor paralelo ao seu X.',

 {id:'L1Q2',tit:'Questão 2',tools:['B'],resumo:'Ângulo entre diagonal e aresta do cubo',
  en:'Determine o ângulo entre a diagonal de um cubo e uma de suas arestas. Sendo V1 = (1, 0, 0), V2 = (0, 1, 0) e V3 = (0, 0, 1) as arestas e D a diagonal do cubo (D = V1 + V2 + V3).',
  steps:[
   {t:'A diagonal',f:[{k:'x',a:'1'},{k:'y',a:'1'},{k:'z',a:'1'}],rows:[[0,1,2]],rowLabels:['D'],h:['Soma de vetores: coordenada com coordenada.']},
   {t:'Ingredientes do ângulo (use a aresta V1)',f:[{k:'d',l:'D·V1 =',a:'1'},{k:'nd',l:'‖D‖ =',a:'sqrt(3)'},{k:'nv',l:'‖V1‖ =',a:'1'}],h:['Produto escalar: multiplica e soma.','‖D‖ = √(1² + 1² + 1²).']},
   {t:'cos θ',f:[{k:'c',l:'cos θ =',a:'1/sqrt(3)',w:1}],h:['cos θ = D·V1 / (‖D‖·‖V1‖).','Pode deixar a raiz no denominador ou racionalizar; as duas formas valem.']},
   {t:'O ângulo',d:'Escreva a resposta exata como θ = arccos(cos θ que você achou). Aqui, digite o valor aproximado em graus.',f:[{k:'g',l:'θ ≈',a:'54.7356',tol:0.15},],
    h:['Na calculadora, em modo graus: SHIFT cos (cos⁻¹) do valor.','Uma casa decimal basta.'],ok:'Na prova, escreva as duas formas: a exata (arccos) e a aproximada em graus.'}]},
 {id:'L1Q3',tit:'Questão 3',tools:['B'],resumo:'V = V1 + V2 com V1 ∥ W e V2 ⟂ W',
  en:'Sejam V = (2, −1, 3) e W = (4, −1, 2) vetores. Encontre dois vetores V1 e V2 tais que V = V1 + V2, V1 é paralelo a W e V2 é perpendicular a W.',
  intro:'<div class="tipn">V1 paralelo a W quer dizer V1 = c·W. É a <b>projeção</b> de V sobre W (slide 21). V2 é o que sobra.</div>',
  steps:[
   {t:'V·W e W·W',f:[{k:'d',l:'V·W =',a:'15'},{k:'w',l:'W·W =',a:'21'}],h:['V·W: multiplique coordenada com coordenada e some. Cuidado com (−1)·(−1).','W·W é a soma dos quadrados de W.']},
   {t:'c = (V·W)/(W·W)',f:[{k:'c',l:'c =',a:'15/21'}],h:['Divida os dois números da etapa 1. Pode simplificar a fração.']},
   {t:'V1 = c·W',f:[{k:'x',a:'20/7'},{k:'y',a:'-5/7'},{k:'z',a:'10/7'}],rows:[[0,1,2]],rowLabels:['V1'],h:['Multiplique c por cada coordenada de W.','Fração vezes inteiro: multiplica só o numerador. Mantenha o sinal da coordenada de W.']},
   {t:'V2 = V − V1',f:[{k:'x',a:'-6/7'},{k:'y',a:'-2/7'},{k:'z',a:'11/7'}],rows:[[0,1,2]],rowLabels:['V2'],h:['Escreva as coordenadas de V em sétimos: 2 = 14/7, −1 = −7/7, 3 = 21/7.','Depois subtraia só os numeradores, com os dois montes.']},
   {t:'Conferência',d:'V2 tem que ser perpendicular a W.',f:[{k:'c',l:'V2·W =',a:'0'}],h:['Multiplique os numeradores pelas coordenadas de W, some, e divida por 7 no final.'],ok:'V2·W = 0 confirma V2 ⟂ W. Escreva na prova como frase final.',
    viz:{items:[{to:[2,-1,3],l:'V',c:'--v1'},{to:[4,-1,2],l:'W',c:'--v2',dash:1},{to:[20/7,-5/7,10/7],l:'V1',c:'--v3'},{from:[20/7,-5/7,10/7],to:[2,-1,3],l:'V2',c:'--v4'}],cap:'<span>V1 deitado sobre W, V2 em pé fechando o triângulo até V.</span>'}}]},
 {id:'L1Q4',tit:'Questão 4',tools:['D'],resumo:'Volume com vértice A e arestas até B, C, D',
  en:'Calcule o volume do paralelogramo que tem um dos vértices no ponto A = (2, 1, 6) e os outros três vértices consecutivos nos pontos B = (4, 1, 3), C = (1, 3, 2) e D = (1, 2, 1).',
  intro:'<div class="tipn">O enunciado diz “paralelogramo”, mas volume é de <b>paralelepípedo</b>. Use o produto misto (slides 16 a 18 da aula do plano).</div>',
  steps:[
   {t:'As três arestas saindo de A',f:[{k:'b0',a:'2'},{k:'b1',a:'0'},{k:'b2',a:'-3'},{k:'c0',a:'-1'},{k:'c1',a:'2'},{k:'c2',a:'-4'},{k:'d0',a:'-1'},{k:'d1',a:'1'},{k:'d2',a:'-5'}],rows:[[0,1,2],[3,4,5],[6,7,8]],rowLabels:['AB','AC','AD'],
    h:['Ponto final menos A em cada uma.','Na 3ª coordenada todos diminuem 6: 3 − 6, 2 − 6, 1 − 6.']},
   {t:'Sarrus com AB, AC, AD nas linhas',html:sarrusGrid([[2,0,-3],[-1,2,-4],[-1,1,-5]]),f:[{k:'d',l:'soma ↘ =',a:'-17'},{k:'u',l:'soma ↙ =',a:'-2'},{k:'det',l:'det =',a:'-15'}],
    h:['Três diagonais descendo (↘) começam em 2, 0 e −3 da 1ª linha. Três subindo (↙) começam em −3, 2 e 0.','Escreva cada produto com parênteses antes de multiplicar. Produto com um zero vale zero.','det = (soma ↘) − (soma ↙). Menos com negativo vira mais.']},
   {t:'Volume',f:[{k:'v',l:'Volume =',a:'15'}],h:['Volume = |det|.'],ok:'Frase final na prova: “Volume = |(AB × AC)·AD| = … u.v.”'}]},
 {id:'L1Q5',tit:'Questão 5',tools:['D'],resumo:'x para A, B, C, D coplanares',
  en:'Determine x para que A = (x, 1, 2), B = (2, −2, −3), C = (5, −1, 1) e D = (3, −2, −2) sejam coplanares.',
  intro:'<div class="tipn">Coplanares ⇔ produto misto = 0 (Corolário 3.9, Ex. 3.15). Nesta guia a base é <b>B</b>, que não tem x. Assim o x fica numa linha só.</div>',
  steps:[

    h:['Ponto final menos B: BA = A − B, BC = C − B, BD = D − B.','Na 1ª coordenada de BA fica uma expressão com x. Digite como x−2 ou parecido.','Cuidado: 1 − (−2) = 1 + 2.']},
   {t:'Sarrus com x',html:sarrusGrid([['x−2',3,5],[3,1,4],[1,0,1]]),vars:'x',f:[{k:'d',l:'soma ↘ =',a:'x+10',w:1},{k:'u',l:'soma ↙ =',a:'14',w:1},{k:'det',l:'det =',a:'x-4',w:1}],
    h:['Trate (x − 2) como um bloco: (x − 2)·1·1 = x − 2.','Produtos com o 0 somem.','det = (soma ↘) − (soma ↙). Junte o que é número.']},
   {t:'Coplanares ⇔ det = 0',f:[{k:'x',l:'x =',a:'4'}],h:['Iguale a expressão do det a zero e isole o x.'],ok:'Conferência: com esse x, monte de novo pela base A e o det também dá 0.'}]}

 {id:'L2Q1',tit:'Questão 1',tools:['F'],resumo:'Quais pares de planos se cortam segundo uma reta',
  en:'Quais dos seguintes pares de planos se cortam segundo uma reta?<br>a) x + 2y − 3z − 4 = 0 e x − 4y + 1 = 0<br>b) 2x − y + 4z + 3 = 0 e 4x − 2y + 8z = 0<br>c) x − y = 0 e x + z = 0',
  intro:'<div class="tipn">Compare os vetores normais (Prop. 1.22). Normais l.i. → se cortam numa reta. Normais l.d. → paralelos ou coincidentes.</div>',
  steps:[
   {t:'Item a)',f:vecF('a',[1,2,-3]).concat(vecF('b',[1,-4,0])),rows:[[0,1,2],[3,4,5]],rowLabels:['N1','N2'],
    c:{q:'Conclusão do item a):',o:['Normais l.i. → se cortam segundo uma reta','Normais l.d. → paralelos ou coincidentes'],a:0},
    h:['O normal são os coeficientes de x, y, z: em x + 2y − 3z − 4 = 0, cada letra traz o seu número.','Na 2ª equação não aparece z: o coeficiente é 0.','Existe K com N2 = K·N1? Divida coordenada por coordenada.']},
   {t:'Item b)',f:vecF('a',[2,-1,4]).concat(vecF('b',[4,-2,8])),rows:[[0,1,2],[3,4,5]],rowLabels:['N1','N2'],
    c:{q:'Conclusão sobre os normais:',o:['Normais l.i. → se cortam segundo uma reta','Normais l.d. → paralelos ou coincidentes'],a:1},
    h:['Divida cada coordenada de N2 pela de N1.','Deu o mesmo número nas três? Então existe K.']},
   {t:'Item b): paralelos ou coincidentes?',d:'Divida a 2ª equação pelo K que você achou e compare com a 1ª, inclusive o termo sem letra.',
    c:{q:'Os planos do item b) são:',o:['Coincidentes (mesma equação)','Paralelos distintos (o d não acompanha)'],a:1},
    h:['4x − 2y + 8z = 0 dividido por 2 vira 2x − y + 4z = 0.','Agora compare com 2x − y + 4z + 3 = 0.']},
   {t:'Item c)',f:vecF('a',[1,-1,0]).concat(vecF('b',[1,0,1])),rows:[[0,1,2],[3,4,5]],rowLabels:['N1','N2'],
    c:{q:'Conclusão do item c):',o:['Normais l.i. → se cortam segundo uma reta','Normais l.d. → paralelos ou coincidentes'],a:0},
    h:['Letra que não aparece tem coeficiente 0.','Onde um tem 0 e o outro não, não existe K.']},
   {t:'Resposta',c:{q:'Quais pares se cortam segundo uma reta?',o:['Só a','a e c','b e c','a, b e c'],a:1},h:['Junte as conclusões dos itens.'],ok:'Na prova, justifique cada item pelos vetores normais, como nas etapas.'}]},

   {t:'vd = N1 × N2',html:crossBox([2,3,1],[1,-1,1]),f:vecF('v',[4,-1,-5]),rows:[[0,1,2]],rowLabels:['vd'],h:crossHints([2,3,1],[1,-1,1])},

 {id:'L2Q5',tit:'Questão 5',tools:['F'],resumo:'Reta de interseção de dois planos (escalonar, z = t)',
  en:'Encontre a equação da reta interseção dos planos π1: 3x − y + z = 0 e π2: x + 2y − z = 1.',
  intro:'<div class="tipn">Método do slide (Equações Paramétricas, slides 8 a 10): matriz aumentada, escalonar, z = t. Nesta guia começamos trocando L1 ↔ L2 para ter o pivô 1 em cima.</div><div class="box">( 1 &nbsp;2 −1 | 1 )  ← L1 (era π2)<br>( 3 −1 &nbsp;1 | 0 )  ← L2 (era π1)</div>',
  steps:[

   {t:'L2 ← L2 ÷ (−7)',f:[{k:'a',a:'0'},{k:'b',a:'1'},{k:'c',a:'-4/7'},{k:'d',a:'3/7'}],rows:[[0,1,2,3]],rowLabels:['L2'],h:['Dividir por negativo troca o sinal de cada elemento.','4 ÷ (−7) = −4/7.']},
   {t:'L1 ← L1 − 2·L2',d:'Zere o 2 acima do pivô.',f:[{k:'a',a:'1'},{k:'b',a:'0'},{k:'c',a:'1/7'},{k:'d',a:'1/7'}],rows:[[0,1,2,3]],rowLabels:['L1'],h:['−1 − 2·(−4/7) = −1 + 8/7. Escreva −1 como −7/7.','1 − 2·(3/7) = 7/7 − 6/7.']},
   {t:'z = t',d:'Leia cada linha como equação: x + (…)z = … e y + (…)z = … Passe o z para a direita e troque por t.',vars:'t',keys:['t'],f:[{k:'x',l:'x =',a:'1/7-t/7',w:1},{k:'y',l:'y =',a:'3/7+4t/7',w:1}],h:['Da L1: x + (1/7)z = 1/7.','Passar para o outro lado troca o sinal: −(−4/7)z vira +4/7·z.']},
   {t:'A reta',d:'Escreva como (x, y, z) = ponto + t·vd.',f:vecF('p',[0,0,0]).map(function(f,i){f.a=['1/7','3/7','0'][i];return f;}).concat(vecF('v',[0,0,0]).map(function(f,i){f.a=['-1/7','4/7','1'][i];return f;})),rows:[[0,1,2],[3,4,5]],rowLabels:['ponto','vd'],
    h:['O ponto são os números soltos (t = 0). O vd são os coeficientes de t, com 1 no z.']},

var GRP={v:'Vetores',pv:'Produto vetorial e plano',r:'Retas',ps:'Posições relativas',pe:'Perpendicularidade'};
var FICHAS=[
 {g:'v',q:'O que é um vetor AB?',a:'Um par ordenado de pontos, denotado por AB. Visualizamos como uma seta com ponto inicial A e ponto final B. Coordenadas: AB = B − A.',ref:'Vetores, Def. 2.4 (slide 8)'},
 {g:'v',q:'Quando AB é equivalente a CD?',a:'Quando B − A = D − C.',ref:'Vetores, Def. 2.5 (slide 8)'},
 {g:'v',q:'Qual a relação entre AB e BA?',a:'AB = −BA. Têm a mesma direção e sentidos opostos.',ref:'Vetores, Obs. 2.12 (slide 12)'},
 {g:'v',q:'Defina o produto escalar A₁·A₂.',a:'A₁·A₂ = a₁a₂ + b₁b₂ + c₁c₂. O resultado é sempre um <b>número</b>.',ref:'Vetores, Def. 2.13 (slide 14)'},
 {g:'v',q:'Quais as 4 propriedades do produto escalar?',a:'1) A·B = B·A<br>2) A·(B + C) = A·B + A·C<br>3) (xA)·B = x(A·B)<br>4) Se A = 0, A·A = 0; caso contrário, A·A > 0.',ref:'Vetores, slide 15'},
 {g:'v',q:'Quando dois vetores são perpendiculares (ortogonais)?',a:'Dois vetores A ≠ 0 e B ≠ 0 são perpendiculares se A·B = 0.',ref:'Vetores, Def. 2.16 (slide 16)'},
 {g:'v',q:'Defina a norma de um vetor.',a:'‖A‖ = √(A·A). Em coordenadas, ‖A‖ = √(a² + b² + c²).',ref:'Vetores, Def. 2.18 (slide 17)'},
 {g:'v',q:'O que é vetor unitário? Como achar o unitário na direção de A?',a:'U é unitário se ‖U‖ = 1. O unitário na direção de A é (1/‖A‖)·A.',ref:'Vetores, slide 18'},
 {g:'v',q:'Quando dois vetores não nulos têm a mesma direção?',a:'Quando existe uma constante c tal que B = cA.',ref:'Vetores, slide 18'},
 {g:'v',q:'Defina a distância entre os pontos A e B.',a:'‖A − B‖ = √((A − B)·(A − B)). É a norma do vetor AB.',ref:'Vetores, Def. 2.21 (slide 19)'},
 {g:'v',q:'Qual a relação entre produto escalar, normas e ângulo?',a:'A·B = ‖A‖‖B‖ cos θ, onde θ é o ângulo entre A e B. Se θ = π/2, A·B = 0.',ref:'Vetores, Prop. 2.24 e Obs. 2.25 (slide 20)'},
 {g:'v',q:'Defina a projeção de A sobre B.',a:'Proj<sub>B</sub>A = cB, com c = (A·B)/(B·B), B ≠ 0. A − cB é ortogonal a B.',ref:'Vetores, Def. 2.26 (slide 21)'},
 {g:'v',q:'Quando ‖A − B‖ = ‖A + B‖?',a:'Se e somente se A·B = 0.',ref:'Vetores, Prop. 2.31 (slide 25)'},
 {g:'pv',q:'Defina o produto vetorial v × w.',a:'É o “determinante” com i, j, k na 1ª linha, v na 2ª e w na 3ª:<br>(v₂w₃ − w₂v₃) i − (v₁w₃ − w₁v₃) j + (v₁w₂ − w₁v₂) k. O resultado é um <b>vetor</b>.',ref:'Plano, Def. 1.3 (slide 3)'},
 {g:'pv',q:'O produto vetorial é comutativo?',a:'Não. Em geral v × w ≠ w × v. Exemplo: i × j = k e j × i = −k.',ref:'Plano, Obs. 1.5 e Ex. 1.6–1.7 (slides 4–5)'},
 {g:'pv',q:'O que a Proposição 1.9 diz sobre x = v × w?',a:'Se v e w são não nulos e não existe c ≠ 0 com w = cv, então x = v × w é ortogonal a v e a w. Além disso, y = w × v também é perpendicular a v e w, e y = −x.',ref:'Plano, Prop. 1.9 (slide 7)'},
 {g:'pv',q:'O que determina um plano no espaço? E uma reta?',a:'Plano: um vetor normal a ele e um de seus pontos. Reta: sua inclinação (direção) e um de seus pontos.',ref:'Plano, slide 8'},
 {g:'pv',q:'Como se chega à equação geral do plano?',a:'X pertence ao plano se PX é ortogonal a N: (X − P)·N = 0 ⇒ ax + by + cz = d, com d = ax₀ + by₀ + cz₀.',ref:'Plano, slides 8–9'},
 {g:'pv',q:'Quando dois vetores são l.d.? E l.i.?',a:'l.d.: estão sobre uma mesma reta que passa pela origem, ou seja, existe K ≠ 0 com u = Kv. l.i.: quando não são l.d. (não existe K).',ref:'Plano, Def. 1.12 e 1.13 (slide 13)'},
 {g:'pv',q:'Como saber se três vetores do espaço são l.d. ou l.i.?',a:'Monte a matriz A com os três vetores nas linhas. Det(A) = 0 → l.d.; Det(A) ≠ 0 → l.i.',ref:'Plano, Prop. 1.21 (slide 15)'},
 {g:'pv',q:'O que é o produto misto?',a:'(V × W)·U, que se calcula como o det da matriz com V, W e U nas linhas.',ref:'Plano, slide 16'},
 {g:'pv',q:'O que diz o Teorema do produto misto?',a:'|(V × W)·U| é numericamente igual ao volume do paralelepípedo determinado por U, V e W.',ref:'Plano, Teorema (slide 17)'},
 {g:'pv',q:'Quando três vetores são coplanares?',a:'Se e somente se (V × W)·U = det = 0. Para quatro pontos: os vetores PQ, PR, PS têm produto misto zero.',ref:'Plano, Corolário 3.9 e Ex. 3.15 (slides 19–20)'},
 {g:'pv',q:'O que acontece com dois planos de normais l.d.?',a:'São coincidentes ou paralelos. (O vetor normal não é único: qualquer vetor na direção de N serve.)',ref:'Plano, Prop. 1.22 (slide 21)'},
 {g:'r',q:'Escreva a equação paramétrica (vetorial) da reta.',a:'(x, y, z) = (x₀, y₀, z₀) + t(a, b, c), com P₀ = (x₀, y₀, z₀) na reta e vd = (a, b, c) o vetor diretor. Quando t percorre os reais, o ponto percorre a reta.',ref:'Paramétricas, slides 2–3'},
 {g:'r',q:'A equação paramétrica de uma reta é única?',a:'Não. Basta escolher qualquer ponto da reta e qualquer vetor diretor l.d. com vd, ou seja, k·vd com k ≠ 0.',ref:'Paramétricas, slides 3–4'},
 {g:'r',q:'Ao substituir a reta na equação do plano, o que cada resultado significa?',a:'t com valor único → interseção em um ponto. 0t = k (k ≠ 0) → a reta é paralela ao plano. 0t = 0 → a reta está contida no plano.',ref:'Paramétricas, Ex. 2.2–2.4 (slides 5–7)'},
 {g:'r',q:'Como achar a reta dada por dois planos?',a:'Monte a matriz aumentada, escalone até a forma escalonada por linha, tome a variável livre z = t e escreva (x, y, z) = ponto + t·vd.',ref:'Paramétricas, slides 8–10'},
 {g:'r',q:'Relacione a classificação do sistema com a posição dos planos.',a:'S.I. (sem solução) → os planos não têm interseção. S.P.I. → se interceptam segundo uma reta ou são coincidentes. S.P.D. → se interceptam em um ponto.',ref:'Paramétricas, tabela (slide 16)'},
 {g:'ps',q:'Quais as posições relativas de duas retas no espaço?',a:'Se interceptam (concorrentes), são paralelas ou são reversas. Reversas: não estão em um mesmo plano.',ref:'Posições, slide 2'},
 {g:'ps',q:'O que os vetores diretores dizem sobre duas retas?',a:'Diretores l.d. → as retas são paralelas (ou coincidentes). Diretores l.i. → concorrentes (no mesmo plano) ou reversas.',ref:'Posições, slide 3'},
 {g:'ps',q:'Diretores l.i.: como decidir entre concorrentes e reversas?',a:'Teste {P₁P₂, A₁, A₂}. l.d. (det = 0) → mesmo plano → concorrentes. l.i. (det ≠ 0) → reversas.',ref:'Posições, slide 4 e Ex. 3.1'},
 {g:'ps',q:'Retas com diretores l.d.: como saber se são coincidentes?',a:'Tome um ponto da primeira reta e verifique se ele pertence à segunda. Se pertence, coincidem.',ref:'Posições, Obs. 3.3 (slide 7)'},

function pFichas(pg){
  var c=el('div','card');
  var f1=el('div','sub');
  [['all','Todos os assuntos']].concat(Object.keys(GRP).map(function(k){return [k,GRP[k]];})).forEach(function(x){var b=el('button','pbtn'+((S.tgrp||'all')===x[0]?' on':''),x[1]);b.type='button';b.onclick=function(){S.tgrp=x[0];save();deck=null;render();};f1.appendChild(b);});
  var f2=el('div','sub');

  c.appendChild(f1);c.appendChild(f2);
  if(!deck)buildDeck();
  if(!deck.list.length){c.appendChild(el('p','muted','Nenhuma ficha neste filtro. Troque o filtro acima.'));pg.appendChild(c);return;}
  if(deck.pos>=deck.list.length){c.appendChild(el('div','fb ok','Fim do baralho. '+deck.list.length+' fichas vistas.'));var r=el('button','btn pri','Embaralhar de novo');r.type='button';r.style.marginTop='10px';r.onclick=function(){deck=null;render();};c.appendChild(r);pg.appendChild(c);return;}
  var i=deck.list[deck.pos],F=FICHAS[i],st=S.cards[i];

  card.innerHTML='<div class="top"><span class="chip">'+GRP[F.g]+'</span><span class="small muted">'+(deck.pos+1)+' de '+deck.list.length+(st?' · '+(st==='sei'?'marcada: sei':'marcada: revisar'):'')+'</span></div><p class="fq">'+F.q+'</p>';
  if(deck.show){card.appendChild(el('div','fa',F.a+'<div class="ref">'+F.ref+'</div>'));}
  c.appendChild(card);
  var acts=el('div','acts');
  if(!deck.show){var sh=el('button','btn pri','Mostrar resposta');sh.type='button';sh.onclick=function(){deck.show=true;render();};acts.appendChild(sh);}
  else{
    var ok=el('button','btn pri','Eu sabia');ok.type='button';ok.onclick=function(){S.cards[i]='sei';save();deck.pos++;deck.show=false;render();};

}
function pQuiz(pg){

  var Q=QUIZ[quiz.order[quiz.pos]];
  c.innerHTML='<div class="top" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="eyebrow">Pergunta '+(quiz.pos+1)+' de '+quiz.order.length+'</span><span class="chip st">'+quiz.ok+' certas</span></div><p class="fq">'+Q.q+'</p>';

    b.onclick=function(){quiz.ans=j;if(j===Q.a)quiz.ok++;if(quiz.pos===quiz.order.length-1){S.quizBest=Math.max(S.quizBest||0,quiz.ok);save();}render();};ch.appendChild(b);});
  c.appendChild(ch);
  if(quiz.ans!==null){c.appendChild(el('div','fb '+(quiz.ans===Q.a?'ok':'bad'),(quiz.ans===Q.a?'Certo. ':'Não. ')+Q.e));

  pg.appendChild(c);
}
function pTodas(pg){

}

<script>
/* Sincronização do progresso: usuário + PIN, guardado no D1 via /api */
(function(){
var AKEY='ga2av-auth';
var UI=['tab','mod','theme','tmode','tgrp','tfil','qtab','open'];
var IC={
 cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
 user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
};
function svg(k){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function getA(){try{return JSON.parse(localStorage.getItem(AKEY)||'null');}catch(e){return null;}}
function setA(a){try{if(a)localStorage.setItem(AKEY,JSON.stringify(a));else localStorage.removeItem(AKEY);}catch(e){}}
var A=getA(),status=A?'wait':'none',timer=null,busy=false,lastSent=null;

function payload(S){var o={};for(var k in S){if(UI.indexOf(k)<0)o[k]=S[k];}return o;}
function hasProgress(o){if(!o)return false;var n=0;['done','train','cards'].forEach(function(k){if(o[k])n+=Object.keys(o[k]).length;});return n>0||!!o.diag||!!o.simBest||!!o.quizBest;}
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x);}
function merge(srv,loc){
  var out={},k;for(k in loc)out[k]=loc[k];
  for(k in srv){if(UI.indexOf(k)>=0)continue;var a=srv[k],b=loc[k];
    if(b===undefined)out[k]=a;
    else if(isObj(a)&&isObj(b)){var o={},kk;for(kk in a)o[kk]=a[kk];for(kk in b){o[kk]=(typeof a[kk]==='number'&&typeof b[kk]==='number')?Math.max(a[kk],b[kk]):b[kk];}out[k]=o;}
    else if(typeof a==='number'&&typeof b==='number')out[k]=Math.max(a,b);}
  return out;
}
function withUI(data,S){var o={},k;for(k in data)o[k]=data[k];UI.forEach(function(u){if(S[u]!==undefined)o[u]=S[u];});return o;}

function api(path,opt){
  opt=opt||{};var h={'content-type':'application/json'};if(A&&A.token)h.authorization='Bearer '+A.token;
  return fetch('/api/'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,keepalive:!!opt.keepalive})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){j._status=r.status;return j;});});
}
function setStatus(s){status=s;paint();}
function expired(){setA(null);A=null;status='none';paint();if(window.GA)GA.toast('Sua sessão expirou. Entre de novo para sincronizar.','bad','alert');}

function push(keep){
  if(!A||busy||!window.GA)return;
  var data=payload(GA.S());var str=JSON.stringify(data);
  if(!A.pending&&str===lastSent)return setStatus('ok');
  busy=true;setStatus('wait');data._ts=Date.now();
  api('progress',{method:'PUT',body:{data:data},keepalive:keep}).then(function(j){busy=false;
    if(j._status===401)return expired();
    if(j.ok){lastSent=str;A.pending=false;A.ts=j.ts;setA(A);setStatus('ok');}else{setStatus('off');}
  }).catch(function(){busy=false;setStatus('off');});
}
function dirty(){
  if(!A||!window.GA)return;
  var str=JSON.stringify(payload(GA.S()));if(str===lastSent&&!A.pending)return;
  A.pending=true;setA(A);if(status!=='wait')setStatus('wait');
  clearTimeout(timer);timer=setTimeout(function(){push(false);},2500);
}
function pull(){
  if(!A||!window.GA)return;setStatus('wait');
  api('progress').then(function(j){
    if(j._status===401)return expired();
    if(j._status!==200)return setStatus('off');
    if(j.name&&j.name!==A.name){A.name=j.name;setA(A);}
    var S=GA.S(),loc=payload(S);
    if(j.data&&j.ts>(A.ts||0)){
      var next=A.pending?merge(j.data,loc):j.data;
      A.ts=j.ts;setA(A);GA.setS(withUI(next,S));
      lastSent=A.pending?null:JSON.stringify(payload(GA.S()));
      if(A.pending)push(false);else setStatus('ok');
    }else{lastSent=A.pending?null:JSON.stringify(loc);if(A.pending||!j.data)push(false);else setStatus('ok');}
  }).catch(function(){setStatus('off');});
}
function afterAuth(j,mode){
  A={token:j.token,user:j.username,name:j.name,ts:0,pending:false};
  var S=GA.S(),loc=payload(S);
  if(mode==='login'){
    var next;
    if(j.data&&hasProgress(loc))next=merge(j.data,loc);
    else if(j.data)next=j.data;
    else next=loc;
    A.ts=j.ts||0;A.pending=true;setA(A);GA.setS(withUI(next,S));lastSent=null;push(false);
  }else{A.pending=false;A.ts=j.ts||0;setA(A);lastSent=JSON.stringify(loc);setStatus('ok');GA.render();}
}

var NKEY='ga2av-nudge';

function count(S){var n=0;if(S.done)n+=Object.keys(S.done).length;if(S.cards)n+=Object.keys(S.cards).length;if(S.train)for(var k in S.train)n+=(+S.train[k]||0);return n;}
function nudge(pg){
  var S=GA.S(),c=count(S),N=getN();
  if(!(N.n===0||(N.n===1&&c>=N.at+5)))return;
  var again=N.n===1;
